function footprintInner(key) {
  return (FOOTPRINTS[key] || FOOTPRINTS.PGLA).trim().replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "");
}
const SECRET_FOOTPRINT = { bat: "secret-bat", ptarmigan: "secret-ptarmigan" };

/* =========================================================
   16タイプ一覧
   入口では仕組みの解説だけを見せ、生息エリアを選ぶと詳細に切り替わる。
   URLは ?g=PS で生息エリア指定、#PSLC でタイプ指定に対応。
   ========================================================= */
const ORDER = ["PS", "PG", "ES", "EG"];
const codesOf = (key) => Object.keys(TYPES).filter((c) => c.slice(0, 2) === key);

/* ---------- 生息エリア切り替えタブ ---------- */
document.getElementById("group-tabs").innerHTML = ORDER.map((key) => {
  const g = GROUPS[key];
  return `<button class="gtab" data-g="${key}">
    ${areaIcon(key)}
    <span class="gtab-name">${g.name}</span>
  </button>`;
}).join("");

/* ---------- 相性のいいタイプ（結果画面と同じルール） ---------- */
function flipAxis(code, axisIndex) {
  const ax = AXES[axisIndex];
  const chars = code.split("");
  chars[axisIndex] = chars[axisIndex] === ax.a ? ax.b : ax.a;
  return chars.join("");
}
function findMatches(code, secret) {
  const w = (typeof MATCH_WHY !== "undefined" && MATCH_WHY[code]) || {};
  const list = [
    { label: "補い合える相手",     code: flipAxis(code, 2), why: w.calm || "" },
    { label: "歩き方が似ている相手", code: flipAxis(code, 0), why: w.spark || "" },
  ];
  if (secret) {
    list.push({
      label: "相性は文句なし",
      code: code,
      why: typeof SECRET_MATCH_WHY !== "undefined" ? SECRET_MATCH_WHY : "",
    });
  } else {
    list.push({
      label: "刺激をくれる相手",
      code: flipAxis(flipAxis(code, 0), 1),
      why: w.opp || "",
    });
  }
  return list;
}

/* ---------- タイプ1件のカード ---------- */
/* シークレットに対応するタイプかどうか */
function secretOf(code) {
  return (typeof SECRETS !== "undefined" && SECRETS.find((s) => s.code === code)) || null;
}

function typeCard(code, asSecret) {
  const sec = asSecret ? secretOf(code) : null;
  const mts = (sec
    ? (typeof SECRET_MOUNTAINS !== "undefined" ? SECRET_MOUNTAINS[sec.id] : null)
    : (typeof MOUNTAINS !== "undefined" ? MOUNTAINS[code] : null)) || [];
  const t = TYPES[code];
  const c = sec
    ? { animal: sec.animal, item: SECRET_CHARACTERS[sec.id].item }
    : (CHARACTERS[code] || { animal: "", item: "" });
  const g = groupOf(code);

  const axisText = code.split("").map((ch, i) => {
    const ax = AXES[i];
    return `<span class="ax"><b>${ch}</b>${ch === ax.a ? ax.aName : ax.bName}</span>`;
  }).join("");

  const matches = findMatches(code, sec).map((m) => {
    const mt = TYPES[m.code], mc = CHARACTERS[m.code];
    if (!mt) return "";
    return `
      <a class="match" href="#${m.code}" style="background:${groupOf(m.code).band}">
        <span class="match-label">${m.label}</span>
        ${characterSVG(m.code, "char char-sm")}
        <span class="match-code" style="background:${groupOf(m.code).deep}">${m.code}</span>
        <span class="match-name">${mc ? mc.animal : mt.name}</span>
        <span class="match-type">${mt.name}</span>
        <span class="match-why">${m.why}</span>
      </a>`;
  }).join("");

  return `
    <article class="type-item${sec ? " is-secret" : ""}" id="${code}"
             ${secretOf(code) ? 'data-secret="1"' : ""}>
      <header class="ti-head">
        <div class="ti-char-wrap">
          ${sec ? secretSVG(sec.id, "char ti-char") : characterSVG(code, "char ti-char")}
        </div>
        <div class="ti-title">
          <h3 class="ti-name">${c.animal}<span class="animal-footprint"><svg viewBox="0 0 100 100">${footprintInner(sec ? (SECRET_FOOTPRINT[sec.id] || "PGLA") : code)}</svg></span></h3>
          <p class="tc-type">${sec ? sec.typeName : t.name}</p>
          <p class="tc-copy">「${sec ? sec.copy : t.copy}」</p>
        </div>
      </header>
      <p class="ti-id">
        <span class="tc-code" style="background:${sec ? "#A5761F" : g.deep}">${code}${sec ? '<em>SECRET</em>' : ""}</span>
        <span class="tc-area" style="color:${g.deep}">生息エリア：${g.name}</span>
      </p>

      <div class="ti-axes">${axisText}<span class="ax ax-item"><b>持ちもの</b>${c.item}</span></div>

      <section class="ti-block">
        <h4 class="ti-label">特徴</h4>
        <p class="ti-text">${sec ? sec.features : t.features}</p>
      </section>

      <section class="ti-block ti-caution">
        <h4 class="ti-label">気をつけたいこと</h4>
        <p class="ti-text">${sec ? sec.caution : t.caution}</p>
      </section>

      <section class="ti-block">
        <h4 class="ti-label">おすすめの山</h4>
        <div class="mt-row">
          ${mts.map((m) => `
            <div class="mt">
              <p class="mt-name">${m.name}${m.note ? '<span class="mt-flag">要注意</span>' : ""}</p>
              ${m.pref ? `<p class="mt-pref">（${m.pref}）</p>` : ""}
              <p class="mt-why">${m.why}</p>
            </div>`).join("")}
        </div>
        ${mts.some((m) => m.note) ? `<p class="mt-note">${MOUNTAIN_NOTE}</p>` : ""}
      </section>

      <section class="ti-block">
        <h4 class="ti-label">一緒に登ると面白い相手</h4>
        <div class="match-row">${matches}</div>
      </section>

    </article>`;
}

/* ---------- 追従タブの高さを測って記録する ----------
   アンカーで移動したときに、カードがタブの下に隠れないようにするため */
function measureTabs() {
  const tabs = document.getElementById("group-tabs");
  if (!tabs) return;
  const h = Math.round(tabs.getBoundingClientRect().height);
  if (h) document.documentElement.style.setProperty("--tab-h", h + "px");
}
window.addEventListener("resize", measureTabs);

/* ---------- 表示の切り替え ---------- */
function showGroup(key, anchor) {
  const g = GROUPS[key] ? GROUPS[key] : GROUPS.PS;
  key = GROUPS[key] ? key : "PS";

  document.querySelectorAll(".gtab").forEach((b) => {
    const on = b.dataset.g === key;
    b.classList.toggle("on", on);
    b.style.background = on ? GROUPS[b.dataset.g].band : "";
    b.style.color = on ? GROUPS[b.dataset.g].deep : "";
  });

  document.getElementById("group-body").innerHTML = `
    <div class="group-hero" style="background:${g.band}">
      <span class="gh-bg" style="color:${g.deep}">${g.name}</span>
      <p class="gh-name" style="color:${g.deep}">${g.name}</p>
      <p class="gh-lead">${g.lead}</p>
      <p class="gh-axis">${g.axis}　${key}＊＊</p>
    </div>
    ${codesOf(key).map((c) => typeCard(c)).join("")}`;

  measureTabs();
  const target = anchor && document.getElementById(anchor);
  if (target) {
    // レイアウトが確定してから移動する
    requestAnimationFrame(() => {
      measureTabs();
      target.scrollIntoView({ block: "start" });
    });
  } else {
    window.scrollTo({ top: 0 });
  }
  // タブ切り替えで高さが変わるので、余白のキャラクターも位置を計算し直す
  requestAnimationFrame(() => { if (typeof renderScatterChars === "function") renderScatterChars(); });
}

/* ---------- URLから初期表示を決める ----------
   ?g=PS があればその生息エリア。なければ #PSLC のアンカーから逆引きする */
function routeFromURL() {
  const q = new URLSearchParams(location.search).get("g");
  const hash = (location.hash || "").slice(1);

  if (q && GROUPS[q]) return showGroup(q, TYPES[hash] ? hash : null);
  if (hash && TYPES[hash]) return showGroup(hash.slice(0, 2), hash);
  if (hash && GROUPS[hash]) return showGroup(hash, null);
  showGroup("PS");   // 指定がなければ孤峰から
}

/* ---------- 操作 ---------- */
document.getElementById("group-tabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".gtab");
  if (!tab) return;
  history.pushState(null, "", `?g=${tab.dataset.g}`);
  showGroup(tab.dataset.g);
});

/* 詳細内の相性リンクは、別生息エリアなら切り替えてから移動する */
document.getElementById("group-body").addEventListener("click", (e) => {
  const link = e.target.closest(".match");
  if (!link) return;
  const code = link.getAttribute("href").slice(1);
  if (!TYPES[code]) return;
  e.preventDefault();
  history.pushState(null, "", `?g=${code.slice(0, 2)}#${code}`);
  showGroup(code.slice(0, 2), code);
});

/* ---------- キャラクターを2秒以内に2回押すと、同じタイプの隠れた姿にかわる ----------
   タップの記録はカード自身に持たせる（差し替え時に自然にリセットされる） */
document.getElementById("group-body").addEventListener("click", (e) => {
  const wrap = e.target.closest(".ti-char-wrap");
  if (!wrap) return;
  const card = wrap.closest(".type-item");
  if (!card || !card.dataset.secret) return;

  const now = Date.now();
  const taps = (card.dataset.taps || "")
    .split(",")
    .filter(Boolean)
    .map(Number)
    .filter((t) => now - t < 2000);
  taps.push(now);

  if (taps.length < 2) {
    card.dataset.taps = taps.join(",");
    return;
  }
  card.replaceWith(
    document.createRange().createContextualFragment(
      typeCard(card.id, !card.classList.contains("is-secret"))
    )
  );
});

window.addEventListener("popstate", routeFromURL);
routeFromURL();

/* スクロール追従ヘッダー（このページは常時「トップページ相当」の扱いでよい） */
(function initScrollHeader() {
  const header = document.getElementById("scroll-header");
  if (!header) return;
  let lastY = window.scrollY;
  let ticking = false;

  function setHeaderVisible(visible) {
    header.classList.toggle("show", visible);
    document.body.classList.toggle("header-visible", visible);
    if (visible) {
      // タブ側で使う「ヘッダーの高さ分」を、実測してCSS変数に反映する
      document.documentElement.style.setProperty("--header-h", header.getBoundingClientRect().height + "px");
    }
  }

  function onScroll() {
    const y = window.scrollY;
    if (y < 80) setHeaderVisible(false);
    else if (y < lastY) setHeaderVisible(true);
    else if (y > lastY) setHeaderVisible(false);
    lastY = y;
  }
  window.addEventListener("scroll", () => {
    if (!ticking) {
      requestAnimationFrame(() => { onScroll(); ticking = false; });
      ticking = true;
    }
  }, { passive: true });
})();



/* 余白の足跡散らし（トップページと同じ考え方。このページは幅720pxのため半幅を360で計算）
   グリッドベース配置：120px四方のマス目に区切り、1マスにつき最大1個までとして重なりを防ぐ。
   全マスの20〜30%だけを間引いて選び、マス中心から数pxランダムにズラして（ジッター）配置する */
function renderScatterChars() {
  try {
    if (window.innerWidth < 768) {
      const old = document.getElementById("scatter-layer");
      if (old) old.remove();
      return;
    }
    let layer = document.getElementById("scatter-layer");
    if (!layer) {
      layer = document.createElement("div");
      layer.id = "scatter-layer";
      document.body.insertBefore(layer, document.body.firstChild);
    }
    layer.innerHTML = "";
    const height = Math.max(document.body.scrollHeight, window.innerHeight);
    layer.style.height = height + "px";
    const contentHalf = 360;
    const viewportHalf = window.innerWidth / 2;

    const keys = Object.keys(FOOTPRINTS);
    const CELL = 120;
    const FILL_RATIO = 0.25;
    const JITTER = CELL * 0.28;

    const cols = Math.ceil(window.innerWidth / CELL);
    const rows = Math.ceil(height / CELL);

    const candidates = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cx = c * CELL + CELL / 2;
        const cy = r * CELL + CELL / 2;
        if (Math.abs(cx - viewportHalf) < contentHalf + 20) continue;
        candidates.push({ cx, cy });
      }
    }
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    const pickCount = Math.round(candidates.length * FILL_RATIO);
    const chosen = candidates.slice(0, pickCount);

    chosen.forEach(({ cx, cy }) => {
      const x = cx + (Math.random() * 2 - 1) * JITTER;
      const y = cy + (Math.random() * 2 - 1) * JITTER;
      const size = 14 + Math.random() * 14;
      const key = keys[Math.floor(Math.random() * keys.length)];
      const rot = Math.round(Math.random() * 360);

      const el = document.createElement("div");
      el.className = "scatter-print";
      el.style.left = x + "px";
      el.style.top = y + "px";
      el.style.width = size + "px";
      el.style.transform = `rotate(${rot}deg)`;
      el.innerHTML = FOOTPRINTS[key];
      layer.appendChild(el);
    });
  } catch (err) {
    console.error("scatter render error", err);
  }
}
renderScatterChars();
let scatterUpdateTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(scatterUpdateTimer);
  scatterUpdateTimer = setTimeout(renderScatterChars, 200);

});
</script>
